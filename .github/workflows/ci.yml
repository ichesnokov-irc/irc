name: IRC Library C++20 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-latest
            compiler: clang-17
            cc: clang-17
            cxx: clang++-17
          - os: windows-latest
            compiler: msvc-2022
            cc: cl
            cxx: cl
          - os: macos-14
            compiler: apple-clang
            cc: clang
            cxx: clang++

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Latest GCC/Clang on Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        if [ "${{ matrix.compiler }}" = "gcc-13" ]; then
          sudo apt-get install -y g++-13 gcc-13
        elif [ "${{ matrix.compiler }}" = "clang-17" ]; then
          sudo apt-get install -y clang-17
        fi

    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build IRC Tests
      run: |
        cmake --build build --config Release

    - name: Run IRC Tests
      working-directory: build
      run: |
        ctest -C Release --output-on-failure
